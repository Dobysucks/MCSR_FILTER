[project]
name = "mcsr-26-2-seed-filter"
version = "0.1.0"
description = "Strictly version-gated MCSR seed filter with cumulative SQLite cache"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["mcsr_filter*"]
